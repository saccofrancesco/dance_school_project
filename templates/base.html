{% load static %}
<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dance School{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container" aria-label="Navigazione principale">
            <a class="brand" href="{% url 'home' %}" aria-label="Dance School, pagina iniziale">
                <span class="brand-mark" aria-hidden="true">DS</span>
                <span class="brand-name">Dance School</span>
            </a>

            <div class="nav-links">
                <a class="nav-link" href="{% url 'about' %}">Chi siamo</a>
                <a class="nav-link" href="{% url 'school_list' %}">Sedi</a>
                <a class="nav-link" href="{% url 'day_of_the_week_list' %}">Giorni</a>
                <a class="nav-link" href="{% url 'classroom_list' %}">Aule</a>
                <a class="nav-link" href="{% url 'course_list' %}">Corsi</a>
                <a class="nav-link nav-link--accent" href="{% url 'admin:index' %}">Admin</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <span>© {% now "Y" %} Dance School</span>
            <!-- Sostituisci questi recapiti con quelli reali della scuola. -->
            <div class="footer-contact">
                <a href="tel:+390000000000">Telefono: +39 000 000 0000</a>
                <a href="mailto:info@danceschool.example">Email: info@danceschool.example</a>
            </div>
        </div>
    </footer>

</body>
</html>
