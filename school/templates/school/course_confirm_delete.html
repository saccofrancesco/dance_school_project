{% extends "base.html" %}

{% block title %}Elimina corso - Dance School{% endblock %}

{% block content %}
    <section class="form-page">
        <header class="page-header">
            <a class="back-link" href="{% url 'course_detail' pk=course.pk %}">← Dettaglio corso</a>
            <h1>Elimina corso</h1>
        </header>
        <div class="delete-summary">
            <p>Vuoi eliminare <strong>{{ course.subject }}</strong>?</p>
            <p>L’operazione non può essere annullata.</p>
        </div>
        <form class="object-form" method="post">
            {% csrf_token %}
            <div class="form-actions">
                <button class="button button--danger" type="submit">Conferma eliminazione</button>
                <a class="button button--secondary" href="{% url 'course_detail' pk=course.pk %}">Annulla</a>
            </div>
        </form>
    </section>
{% endblock %}
